<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米家设备控制台 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="glass-card rounded-2xl shadow-2xl p-8 w-full max-w-md">
        <!-- 标题 -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-100 rounded-2xl mb-4">
                <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">米家设备控制台</h1>
            <p class="text-gray-500 mt-2 text-sm">请输入密码以访问控制面板</p>
        </div>

        <!-- 登录表单 -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                <input type="password" id="password" name="password"
                       class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none transition"
                       placeholder="请输入管理员密码" autocomplete="current-password" required>
            </div>

            <!-- 错误提示 -->
            <div id="errorMsg" class="hidden p-3 rounded-xl bg-red-50 text-red-600 text-sm text-center">
            </div>

            <button type="submit"
                    id="loginBtn"
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition shadow-lg shadow-indigo-200 disabled:opacity-50 disabled:cursor-not-allowed">
                <span id="loginBtnText">登 录</span>
            </button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-6">
            MiHome Control Panel v1.0
        </p>
    </div>

    <script>
        // 登录表单提交处理
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const loginBtnText = document.getElementById('loginBtnText');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            // 防抖：禁用按钮，防止重复提交
            loginBtn.disabled = true;
            loginBtnText.textContent = '登录中...';
            errorMsg.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: passwordInput.value })
                });
                const data = await response.json();

                if (data.code === 0 && data.token) {
                    // 保存 Token 到 sessionStorage
                    sessionStorage.setItem('auth_token', data.token);
                    // 跳转到控制台
                    window.location.href = '/dashboard';
                } else {
                    errorMsg.textContent = data.message || '登录失败';
                    errorMsg.classList.remove('hidden');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请重试';
                errorMsg.classList.remove('hidden');
            } finally {
                loginBtn.disabled = false;
                loginBtnText.textContent = '登 录';
            }
        });

        // 自动聚焦密码输入框
        passwordInput.focus();
    </script>
</body>
</html>
